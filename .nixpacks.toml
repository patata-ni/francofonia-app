# .nixpacks.toml para Laravel + Vite
[phases.setup]
nixPkgs = ["php", "nodejs", "composer", "npm"]

[phases.build]
cmds = [
  "composer install --optimize-autoloader --no-scripts --no-interaction",
  "npm ci --include=dev",
  "npm run build"
]

[phases.start]
cmd = "php artisan serve --host=0.0.0.0 --port=8080"
